name: 🅿️ Park Your Avatar
description: Click here to upload and share your profile picture!
title: "[Parking Lot] New Avatar"
labels: ["parking-lot"]
body:
  - type: markdown
    attributes:
      value: |
        ### Welcome to the Parking Lot! 🚗
        Drop your avatar image below to park on my profile.
  - type: textarea
    id: avatar-upload
    attributes:
      label: Upload your profile image here
      description: Drag and drop your image file right into the box below, or click to select it from your device.
      placeholder: "Attach your image here..."
    validations:
      required: true
