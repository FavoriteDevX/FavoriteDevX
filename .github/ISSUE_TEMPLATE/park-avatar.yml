name: 🅿️ Park Your Avatar
description: Click here to upload your profile picture!
title: "[Parking Lot] New Avatar Submission"
labels: ["parking-lot"]
body:
  - type: markdown
    attributes:
      value: |
        ### Welcome to the Parking Lot! 🚗
        Please upload your image below.
  - type: textarea
    id: avatar-upload
    attributes:
      label: Attach your profile image here
      description: Drag and drop your picture, or click below to browse and select it.
      placeholder: "Drag your file here or click to add files..."
    validations:
      required: true
